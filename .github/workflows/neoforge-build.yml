name: NeoForge v0.6.2 Compile
on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - name: Core invariants
        run: bash scripts/test-core.sh
      - name: Compile and package NeoForge mod
        run: gradle -p mod-neoforge build --stacktrace --no-daemon
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: roglercore-0.6.2-unverified-runtime
          path: mod-neoforge/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
