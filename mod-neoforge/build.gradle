plugins {
    id 'java-library'
    id 'net.neoforged.gradle.userdev' version '7.1.38'
}

group = mod_group_id
version = mod_version
// Player-facing archive name changes, but the registry namespace stays roglerteamwars.
base { archivesName = "roglercore" }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    // GitHub Actions generates this small Maven repository from Create's
    // SHA-256-verified embedded Registrate. Local developer builds keep the
    // regular remote-Maven resolution when the directory is absent.
    maven {
        url = uri("${rootProject.projectDir}/../.ci-maven")
        content { includeGroup 'com.tterrag.registrate' }
    }
    mavenCentral()
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://maven.ithundxr.dev/snapshots' }
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    implementation "net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}"
    compileOnly "dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}"
    runtimeOnly "dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}"
    implementation "com.tterrag.registrate:Registrate:${registrate_version}"
}

sourceSets.main.java.srcDir('../core/src/main/java')

runs {
    configureEach { modSource project.sourceSets.main }
    client { }
    server { argument '--nogui' }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
