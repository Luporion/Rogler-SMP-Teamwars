description='''
Rogler Core v0.7.4: Architectury-compatible FTB packet transport and Xaero custom-waypoint map fix; FTB teammate-only player visibility, Xaero cave-mode preservation and experimental FTB-to-Xaero local waypoint mirror; server-filtered teammate coordinate packets, volatile session state and an optional companion HUD; enemy radar privacy, personal exploration provenance and membership-aware visibility snapshots; optional Sable 2.0.6 removed-owner/anchor split preflight without Sable Destructive, bounded diagnostics, existing base/claim recovery and optional Warium startup quarantine.
The Warium quarantine is OFF by default; it does not rewrite entity regions or guarantee repair of malformed .mca files.
'''

